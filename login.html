<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Login - POPSWOLFS CONNECT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:#222;
    padding:30px 25px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
    color:white;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:28px;
    font-size:14px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:bold;
    color:#ddd;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #444;
    background:#111;
    color:white;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#00c853;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#555;
}

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    min-height:20px;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#aaa;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        🐺 POPSWOLFS CONNECT
    </div>

    <div class="subtitle">
        Owner Login
    </div>

    <form id="loginForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter owner email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button
            type="submit"
            id="loginButton">
            🔐 Login
        </button>

    </form>

    <div
        class="message"
        id="message">
    </div>

    <a
        href="index.html"
        class="back">
        ← Back to Website
    </a>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<script>

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA5BGPb4gmsiEI0nO6bLA-3r2qJTdcJm-A",
  authDomain: "popswolfs-connect.firebaseapp.com",
  projectId: "popswolfs-connect",
  storageBucket: "popswolfs-connect.firebasestorage.app",
  messagingSenderId: "761803503052",
  appId: "1:761803503052:web:731ea5982a21d885075969",
  measurementId: "G-R3H3C9TL7Q"
};


firebase.initializeApp(firebaseConfig);


const auth =
firebase.auth();


/* ==========================
   LOGIN
========================== */

document
.getElementById("loginForm")
.addEventListener("submit", function(event){

    event.preventDefault();


    const email =
    document
    .getElementById("email")
    .value
    .trim();


    const password =
    document
    .getElementById("password")
    .value;


    const message =
    document
    .getElementById("message");


    const button =
    document
    .getElementById("loginButton");


    message.style.color = "#aaa";

    message.textContent =
    "⏳ Login checking...";


    button.disabled = true;


    /* ==========================
       FIREBASE LOGIN
    ========================== */

    auth
    .signInWithEmailAndPassword(
        email,
        password
    )

    .then(function(result){

        const user =
        result.user;


        /*
        Firebase UID save karenge.

        Baad mein isi UID ke saath
        Shop ID connect karenge.
        */

        localStorage.setItem(
            "ownerLoggedIn",
            "true"
        );


        localStorage.setItem(
            "ownerUID",
            user.uid
        );


        localStorage.setItem(
            "ownerEmail",
            user.email
        );


        message.style.color =
        "#00c853";


        message.textContent =
        "✅ Login successful!";


        setTimeout(function(){

            window.location.href =
            "dashboard.html";

        },700);

    })

    .catch(function(error){

        console.error(
            "Firebase Login Error:",
            error
        );


        button.disabled = false;


        message.style.color =
        "#ff5252";


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            message.textContent =
            "❌ Email ya password galat hai.";

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            message.textContent =
            "❌ Ye owner account nahi mila.";

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            message.textContent =
            "❌ Password galat hai.";

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            message.textContent =
            "❌ Email address galat hai.";

        }

        else{

            message.textContent =
            "❌ Login failed: " +
            error.message;

        }

    });

});


/* ==========================
   AUTO LOGIN CHECK
========================== */

auth.onAuthStateChanged(
function(user){

    if(user){

        /*
        Agar owner already logged in hai,
        to dashboard open hoga.
        */

        localStorage.setItem(
            "ownerLoggedIn",
            "true"
        );

        localStorage.setItem(
            "ownerUID",
            user.uid
        );

        localStorage.setItem(
            "ownerEmail",
            user.email
        );

    }

});

</script>

</body>
</html>
