<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POPSWOLFS Reviews</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  padding:20px;
}

.box{
  max-width:600px;
  margin:auto;
  background:#222;
  padding:30px 20px;
  border-radius:15px;
  text-align:center;
}

.logo{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:50%;
  margin-bottom:15px;
}

h1{
  margin-bottom:10px;
}

p{
  color:#ccc;
  line-height:1.5;
}

.review-btn{
  display:block;
  text-decoration:none;
  background:#f5b400;
  color:#111;
  padding:16px;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  margin-top:25px;
}

.review-btn:hover{
  background:#ffc933;
}

.back-btn{
  display:block;
  text-decoration:none;
  background:#333;
  color:white;
  padding:14px;
  border-radius:10px;
  margin-top:15px;
}

.stars{
  font-size:35px;
  margin:15px 0;
}
</style>
</head>

<body>

<div class="box">

<img src="popswolfs.jpeg" class="logo">

<h1>⭐ Customer Reviews</h1>

<div class="stars">★★★★★</div>

<p>
Aapka experience kaisa raha?
<br>
Humein apna honest review dene ke liye Google par review karein.
</p>

<a
href="https://www.google.com/"
target="_blank"
class="review-btn">
⭐ Give us a Google Review
</a>

<a href="dashboard.html" class="back-btn">
← Back to Dashboard
</a>

</div>

</body>
</html>
