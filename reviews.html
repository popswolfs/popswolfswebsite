<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POPSWOLFS Reviews</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    padding:20px;
}

.box{
    max-width:600px;
    margin:auto;
    background:#222;
    padding:25px;
    border-radius:15px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

.review-card{
    background:#333;
    padding:18px;
    border-radius:12px;
    margin-bottom:15px;
}

.review-name{
    font-weight:bold;
    font-size:18px;
    margin-bottom:8px;
}

.stars{
    color:#ffd700;
    font-size:20px;
    margin-bottom:8px;
}

.review-text{
    color:#ddd;
    line-height:1.5;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#00a844;
}

.back{
    background:#555;
}

.back:hover{
    background:#444;
}

#message{
    text-align:center;
    margin-top:15px;
    color:#00e676;
    display:none;
}
</style>
</head>

<body>

<div class="box">

<h1>⭐ Customer Reviews</h1>

<p class="subtitle">
See what customers are saying
</p>

<div class="review-card">
    <div class="review-name">Rahul</div>
    <div class="stars">★★★★★</div>
    <div class="review-text">
        Great service and amazing experience!
    </div>
</div>

<div class="review-card">
    <div class="review-name">Aman</div>
    <div class="stars">★★★★☆</div>
    <div class="review-text">
        Very good service. I will definitely visit again.
    </div>
</div>

<div class="review-card">
    <div class="review-name">Priya</div>
    <div class="stars">★★★★★</div>
    <div class="review-text">
        Excellent experience and friendly staff.
    </div>
</div>

<button onclick="addReview()">
    ⭐ Add Customer Review
</button>

<p id="message">
    Review feature will be connected soon!
</p>

<button class="back" onclick="window.location.href='dashboard.html'">
    ← Back to Dashboard
</button>

</div>

<script>

function addReview(){

    document.getElementById("message").style.display="block";

}

</script>

</body>
</html>
