<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POPSWOLFS - Edit Menu</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

.box{
  max-width:550px;
  margin:auto;
  background:#222;
  padding:25px;
  border-radius:18px;
}

h1{
  text-align:center;
}

input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:0;
  border-radius:10px;
  font-size:16px;
}

textarea{
  height:220px;
  resize:none;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.back{
  background:#555;
}
</style>
</head>

<body>

<div class="box">

<h1>🍔 Edit Menu</h1>

<input
  id="restaurant"
  type="text"
  placeholder="Restaurant Name">

<textarea
  id="menu"
  placeholder="Write menu here...

Chicken Burger - ₹200
Pizza - ₹399
Cold Coffee - ₹89"></textarea>

<input
  id="special"
  type="text"
  placeholder="Today's Special">

<button onclick="saveMenu()">
💾 Save Menu
</button>

<button class="back" onclick="goBack()">
⬅️ Back to Dashboard
</button>

</div>
  
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyA5GBPb4gmsiEIe0n6bLA-3r2qJTdcJm-A",
    authDomain: "popswolfs-connect.firebaseapp.com",
    projectId: "popswolfs-connect",
    storageBucket: "popswolfs-connect.firebasestorage.app",
    messagingSenderId: "76180350352",
    appId: "1:76180350352:web:731ea5982a1d885075969"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* ==============================
   SHOP ID
   ============================== */

const shopId = "SHOP001";


/* ==============================
   LOAD MENU
   ============================== */

async function loadMenu() {

    try {

        const doc = await db
            .collection("shops")
            .doc(shopId)
            .get();

        if (doc.exists) {

            const shop = doc.data();

            document.getElementById("restaurant").value =
                shop.name || "";

            document.getElementById("menu").value =
                shop.menuText || "";

            document.getElementById("special").value =
                shop.specialText || "";

        }

    } catch (error) {

        console.error("Load menu error:", error);

        alert("❌ Menu load nahi hua.");

    }

}


/* ==============================
   SAVE MENU
   ============================== */

async function saveMenu() {

    const restaurant =
        document.getElementById("restaurant")
        .value
        .trim();

    const menu =
        document.getElementById("menu")
        .value
        .trim();

    const special =
        document.getElementById("special")
        .value
        .trim();


    try {

        await db
            .collection("shops")
            .doc(shopId)
            .set({

                name: restaurant,

                menuText: menu,

                specialText: special

            }, {

                merge: true

            });


        alert("✅ Menu Firebase mein save ho gaya!");

        window.location.href =
            "dashboard.html";


    } catch (error) {

        console.error(
            "Save menu error:",
            error
        );

        alert(
            "❌ Menu save nahi hua.\n\n" +
            error.message
        );

    }

}


/* ==============================
   BACK
   ============================== */

function goBack() {

    window.location.href =
        "dashboard.html";

}


/* ==============================
   START
   ============================== */

loadMenu();

</script>

</body>
</html>
