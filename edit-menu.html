<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POPSWOLFS - Edit Menu</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

.box{
  max-width:600px;
  margin:auto;
  background:#222;
  padding:25px;
  border-radius:18px;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

input,textarea{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:0;
  border-radius:10px;
  font-size:16px;
}

textarea{
  height:180px;
  resize:vertical;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#00a844;
}

.back{
  background:#555;
}

.menu-title{
  margin-top:25px;
  margin-bottom:10px;
  font-size:20px;
  font-weight:bold;
}

.item{
  background:#333;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
}

.item-name{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.photo-input{
  background:white;
  color:#111;
  padding:10px;
  width:100%;
  border-radius:8px;
  margin-top:8px;
}

.preview{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
  display:none;
}

.small{
  color:#aaa;
  font-size:13px;
  margin-top:5px;
}

#menuItems{
  display:none;
}
</style>
</head>

<body>

<div class="box">

<h1>🍔 Edit Menu</h1>

<input
  id="restaurant"
  type="text"
  placeholder="Restaurant Name">

<textarea
  id="menu"
  placeholder="Write menu here...

Chicken Burger - 200
Pizza - 399
Cold Coffee - 89"></textarea>

<input
  id="special"
  type="text"
  placeholder="Today's Special">

<div class="menu-title">
📷 Menu Item Photos
</div>

<div class="small">
Pehle menu ko save/load hone do. Phir har item ke liye photo select kar sakte ho.
</div>

<div id="menuItems"></div>

<button onclick="saveMenu()">
💾 Save Menu
</button>

<button class="back" onclick="goBack()">
⬅️ Back to Dashboard
</button>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>

const firebaseConfig = {
    apiKey: "AIzaSyA5GBPb4gmsiEIe0n6bLA-3r2qJTdcJm-A",
    authDomain: "popswolfs-connect.firebaseapp.com",
    projectId: "popswolfs-connect",
    storageBucket: "popswolfs-connect.firebasestorage.app",
    messagingSenderId: "76180350352",
    appId: "1:76180350352:web:731ea5982a1d885075969"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let shopId = "";

let menuPhotos = {};


/* ==============================
   LOAD MENU
   ============================== */

async function loadMenu(){

    try{

        const doc = await db
            .collection("shops")
            .doc(shopId)
            .get();

        if(doc.exists){

            const shop = doc.data();

            document.getElementById("restaurant").value =
                shop.name || "";

            document.getElementById("menu").value =
                shop.menuText || "";

            document.getElementById("special").value =
                shop.specialText || "";

            menuPhotos =
                shop.menuPhotos || {};

            createMenuPhotoOptions(
                shop.menuText || ""
            );

        }

    }catch(error){

        console.error("Load menu error:",error);

        alert(
            "❌ Menu load nahi hua.\n\n" +
            error.message
        );

    }

}


/* ==============================
   CREATE PHOTO OPTIONS
   ============================== */

function createMenuPhotoOptions(menuText){

    const container =
        document.getElementById("menuItems");

    container.innerHTML = "";

    if(!menuText.trim()){

        container.style.display = "none";

        return;

    }

    const lines =
        menuText
        .split("\n")
        .map(line => line.trim())
        .filter(line => line !== "");

    if(lines.length === 0){

        container.style.display = "none";

        return;

    }

    container.style.display = "block";


    lines.forEach(function(line,index){

        const parts =
            line.split(/\s*[-—_]+\s*/);

        const name =
            (parts[0] || "Menu Item").trim();

        const item =
            document.createElement("div");

        item.className = "item";

        const existingPhoto =
            menuPhotos[index] || "";

        item.innerHTML = `

            <div class="item-name">
                🍽️ ${escapeHtml(name)}
            </div>

            <input
                class="photo-input"
                type="file"
                accept="image/*"
                onchange="selectPhoto(${index}, this)">

            <img
                id="preview-${index}"
                class="preview"
                ${existingPhoto
                    ? `src="${existingPhoto}" style="display:block;"`
                    : ""}>

        `;

        container.appendChild(item);

    });

}


/* ==============================
   SELECT PHOTO
   ============================== */

function selectPhoto(index,input){

    const file =
        input.files[0];

    if(!file){

        return;

    }

    if(!file.type.startsWith("image/")){

        alert("❌ Sirf image select karo.");

        input.value = "";

        return;

    }

    compressImage(
        file,
        function(imageData){

            menuPhotos[index] =
                imageData;

            const preview =
                document.getElementById(
                    "preview-" + index
                );

            preview.src =
                imageData;

            preview.style.display =
                "block";

        }
    );

}


/* ==============================
   COMPRESS IMAGE
   ============================== */

function compressImage(file,callback){

    const reader =
        new FileReader();

    reader.onload = function(e){

        const img =
            new Image();

        img.onload = function(){

            const maxSize = 600;

            let width =
                img.width;

            let height =
                img.height;

            if(width > height){

                if(width > maxSize){

                    height =
                        Math.round(
                            height *
                            maxSize /
                            width
                        );

                    width =
                        maxSize;

                }

            }else{

                if(height > maxSize){

                    width =
                        Math.round(
                            width *
                            maxSize /
                            height
                        );

                    height =
                        maxSize;

                }

            }

            const canvas =
                document.createElement("canvas");

            canvas.width =
                width;

            canvas.height =
                height;

            const ctx =
                canvas.getContext("2d");

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );

            const compressed =
                canvas.toDataURL(
                    "image/jpeg",
                    0.65
                );

            callback(compressed);

        };

        img.src =
            e.target.result;

    };

    reader.readAsDataURL(file);

}


/* ==============================
   SAVE MENU
   ============================== */

async function saveMenu(){

    const restaurant =
        document
        .getElementById("restaurant")
        .value
        .trim();

    const menu =
        document
        .getElementById("menu")
        .value
        .trim();

    const special =
        document
        .getElementById("special")
        .value
        .trim();


    if(!restaurant){

        alert("❌ Restaurant Name likho.");

        return;

    }


    try{

        await db
            .collection("shops")
            .doc(shopId)
            .set({

                name: restaurant,

                menuText: menu,

                specialText: special,

                menuPhotos: menuPhotos

            },{
                merge:true
            });


        alert(
            "✅ Menu + Photos Firebase mein save ho gaye!"
        );


        createMenuPhotoOptions(menu);


    }catch(error){

        console.error(
            "Save menu error:",
            error
        );

        alert(
            "❌ Save nahi hua.\n\n" +
            error.message
        );

    }

}


/* ==============================
   ESCAPE HTML
   ============================== */

function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==============================
   BACK
   ============================== */

function goBack(){

    window.location.href =
        "dashboard.html";

}


/* ==============================
   START
   ============================== */

firebase.auth().onAuthStateChanged(async function(user){

    if(!user){
        window.location.href = "login.html";
        return;
    }

    try{

        const snapshot = await db
            .collection("shops")
            .where("ownerEmail","==",user.email.toLowerCase())
            .get();

        if(snapshot.empty){
            alert("❌ Is email par koi shop assigned nahi hai.");
            return;
        }

        shopId = snapshot.docs[0].id;

        console.log("Owner Shop:", shopId);

        loadMenu();

    }catch(error){

        console.error("Owner shop load error:", error);

        alert(
            "❌ Shop load nahi hui.\n\n" +
            error.message
        );
    }

});

</script>

</body>
</html>
