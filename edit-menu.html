<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POPSWOLFS - Edit Menu</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

.box{
  max-width:550px;
  margin:auto;
  background:#222;
  padding:25px;
  border-radius:18px;
}

h1{
  text-align:center;
}

input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:0;
  border-radius:10px;
  font-size:16px;
}

textarea{
  height:220px;
  resize:none;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.back{
  background:#555;
}
</style>
</head>

<body>

<div class="box">

<h1>🍔 Edit Menu</h1>

<input
  id="restaurant"
  type="text"
  placeholder="Restaurant Name">

<textarea
  id="menu"
  placeholder="Write menu here...

Chicken Burger - ₹200
Pizza - ₹399
Cold Coffee - ₹89"></textarea>

<input
  id="special"
  type="text"
  placeholder="Today's Special">

<button onclick="saveMenu()">
💾 Save Menu
</button>

<button class="back" onclick="goBack()">
⬅️ Back to Dashboard
</button>

</div>

<script>

function loadMenu(){

  document.getElementById("restaurant").value =
    localStorage.getItem("restaurantName") || "";

  document.getElementById("menu").value =
    localStorage.getItem("restaurantMenu") || "";

  document.getElementById("special").value =
    localStorage.getItem("todaySpecial") || "";
}


function saveMenu(){

  const restaurant =
    document.getElementById("restaurant").value.trim();

  const menu =
    document.getElementById("menu").value.trim();

  const special =
    document.getElementById("special").value.trim();


  localStorage.setItem(
    "restaurantName",
    restaurant
  );

  localStorage.setItem(
    "restaurantMenu",
    menu
  );

  localStorage.setItem(
    "todaySpecial",
    special
  );


  alert("✅ Menu Saved Successfully!");

  window.location.href = "dashboard.html";
}


function goBack(){

  window.location.href = "dashboard.html";

}


loadMenu();

</script>

</body>
</html>
