<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POPSWOLFS CONNECT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.logo{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:50%;
  margin-bottom:10px;
}

header h1{
  font-size:30px;
  margin-bottom:5px;
}

header p{
  color:#ccc;
}

.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  margin:15px 0;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h2{
  margin-bottom:15px;
}

.review-box{
  text-align:center;
}

.review-btn{
  display:block;
  background:#ffb000;
  color:white;
  text-decoration:none;
  padding:16px;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
}

.stars{
  color:#ffc400;
  font-size:30px;
  margin-top:12px;
}

.menu-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.menu-item:last-child{
  border-bottom:none;
}

.price{
  color:#079447;
  font-weight:bold;
}

.contact-btn{
  display:block;
  text-align:center;
  text-decoration:none;
  color:white;
  padding:13px;
  border-radius:10px;
  margin-top:10px;
}

.call{
  background:#087f3d;
}

.whatsapp{
  background:#20b858;
}

.instagram{
  background:#111;
}

.gallery{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.gallery img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:14px;
}

.special{
  background:#fff3cd;
  border-left:5px solid #ffb000;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>

<img id="logo" class="logo" src="popswolfs.jpeg"
     onerror="this.style.display='none'">

<h1 id="restaurantName">Restaurant Name</h1>

<p>Welcome to POPSWOLFS CONNECT</p>

</header>


<div class="container">

<!-- REVIEW -->
<div class="card review-box">

<h2>⭐ Leave a Review</h2>

<a id="reviewButton"
   class="review-btn"
   href="#"
   target="_blank">
⭐ Leave a Review
</a>

<div class="stars">
★★★★★
</div>

</div>


<!-- TODAY SPECIAL -->
<div id="specialCard" class="card special" style="display:none;">

<h2>🔥 Today's Special</h2>

<p id="specialText"></p>

</div>


<!-- MENU -->
<div class="card">

<h2>🍽️ Our Menu</h2>

<div id="menuList">
<p>Menu will appear here.</p>
</div>

</div>


<!-- GALLERY -->
<div class="card">

<h2>📸 Gallery</h2>

<div id="gallery" class="gallery">

<img src="popswolfs.jpeg" alt="Restaurant">

</div>

</div>


<!-- CONTACT -->
<div class="card">

<h2>📞 Contact Us</h2>

<div id="contactArea">

<p>Contact details will appear here.</p>

</div>

</div>

</div>


<footer>

POPSWOLFS CONNECT<br>
Digital Menu & Review System

</footer>


<script>

/* =========================
   RESTAURANT NAME
========================= */

const restaurantName =
localStorage.getItem("restaurantName");

if(restaurantName){
  document.getElementById("restaurantName").innerText =
  restaurantName;
}


/* =========================
   GOOGLE REVIEW LINK
========================= */

const reviewLink =
localStorage.getItem("googleReviewLink");

if(reviewLink){

  document.getElementById("reviewButton").href =
  reviewLink;

}else{

  document.getElementById("reviewButton").href =
  "#";

}


/* =========================
   MENU
========================= */

const menu =
localStorage.getItem("restaurantMenu");

const menuList =
document.getElementById("menuList");

if(menu){

  const lines = menu.split("\n");

  menuList.innerHTML = "";

  lines.forEach(line => {

    if(line.trim() === "") return;

    let parts = line.split("-");

    let itemName = parts[0].trim();

    let itemPrice = "";

    if(parts.length > 1){

      itemPrice = parts.slice(1).join("-").trim();

    }

    const item =
    document.createElement("div");

    item.className = "menu-item";

    item.innerHTML = `
      <span>${itemName}</span>
      <span class="price">${itemPrice}</span>
    `;

    menuList.appendChild(item);

  });

}


/* =========================
   TODAY SPECIAL
========================= */

const special =
localStorage.getItem("todaySpecial");

if(special){

  document.getElementById("specialCard")
  .style.display = "block";

  document.getElementById("specialText")
  .innerText = special;

}


/* =========================
   CONTACT DETAILS
========================= */

const phone =
localStorage.getItem("phone");

const whatsapp =
localStorage.getItem("whatsapp");

const instagram =
localStorage.getItem("instagram");

const contactArea =
document.getElementById("contactArea");

let contactHTML = "";

if(phone){

  contactHTML += `
  <a class="contact-btn call"
     href="tel:${phone}">
     📞 Call Restaurant
  </a>
  `;

}

if(whatsapp){

  contactHTML += `
  <a class="contact-btn whatsapp"
     href="https://wa.me/${whatsapp}"
     target="_blank">
     💬 WhatsApp
  </a>
  `;

}

if(instagram){

  contactHTML += `
  <a class="contact-btn instagram"
     href="${instagram}"
     target="_blank">
     📷 Instagram
  </a>
  `;

}

if(contactHTML){

  contactArea.innerHTML = contactHTML;

}


/* =========================
   GALLERY
========================= */

const gallery =
localStorage.getItem("restaurantGallery");

if(gallery){

  const galleryBox =
  document.getElementById("gallery");

  galleryBox.innerHTML = "";

  const images =
  gallery.split(",");

  images.forEach(image => {

    if(image.trim() === "") return;

    const img =
    document.createElement("img");

    img.src = image.trim();

    galleryBox.appendChild(img);

  });

}

</script>

</body>
</html>
