<!DOCTYPE html>
<html>
<head>
<title>Add Product</title>
<style>
body{
font-family:Arial,sans-serif;
background:#111;
color:white;
padding:30px;
}
.box{
max-width:500px;
margin:auto;
background:#222;
padding:20px;
border-radius:15px;
}
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}
button{
width:100%;
padding:12px;
background:#00a844;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>➕ Add New Product</h2>

<input type="text" placeholder="Product Name">
<input type="text" placeholder="Price">
<input type="text" placeholder="Image URL">

<button onclick="alert('Product Saved Successfully!')">
Save Product
</button>

</div>

</body>
</html>
