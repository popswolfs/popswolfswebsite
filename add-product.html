<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product - POPSWOLFS</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    padding:20px;
}

.box{
    max-width:500px;
    margin:auto;
    background:#222;
    padding:25px;
    border-radius:15px;
}

h2{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    border:0;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:8px;
    background:#00c853;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.back{
    background:#333;
}
</style>
</head>

<body>

<div class="box">

<h2>➕ Add Product</h2>

<label>Product Name</label>
<input id="productName" type="text" placeholder="Example: Chicken Burger">

<label>Price (₹)</label>
<input id="productPrice" type="number" placeholder="Example: 299">

<label>Product Photo URL</label>
<input id="productImage" type="text"
placeholder="Paste image URL">

<button onclick="addProduct()">Add Product</button>

<button class="back"
onclick="window.location.href='dashboard.html'">
⬅ Back to Dashboard
</button>

</div>

<script>

function addProduct(){

    let name = document.getElementById("productName").value.trim();
    let price = document.getElementById("productPrice").value.trim();
    let image = document.getElementById("productImage").value.trim();

    if(name === "" || price === ""){
        alert("Please enter product name and price.");
        return;
    }

    let products =
        JSON.parse(localStorage.getItem("products")) || [];

    products.push({
        name: name,
        price: price,
        image: image
    });

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

    alert("Product added successfully!");

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productImage").value = "";
}

</script>

</body>
</html>
