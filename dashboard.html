<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>POPSWOLFS Owner Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            padding: 20px;
        }

        .dashboard {
            max-width: 520px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .restaurant {
            color: #00c853;
            font-size: 18px;
            font-weight: bold;
        }

        .card {
            background: #222;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin: 7px 0;
            border: none;
            border-radius: 10px;
            background: #00c853;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #00a844;
        }

        .logout {
            background: #d50000;
        }

        .logout:hover {
            background: #b00000;
        }

        .status {
            background: #151515;
            border-left: 4px solid #00c853;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .status p {
            margin: 8px 0;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <div class="header">
        <h1>🐺 POPSWOLFS Dashboard</h1>

        <div class="restaurant" id="restaurantName">
            Restaurant Name
        </div>
    </div>

    <div class="card">

        <button onclick="openPage('add-product.html')">
            ➕ Add Product
        </button>

        <button onclick="openPage('edit-menu.html')">
            🍔 Edit Menu
        </button>

        <button onclick="openPage('gallery.html')">
            📷 Change Gallery
        </button>

        <button onclick="openPage('contact.html')">
            📞 Contact Details
        </button>

        <button onclick="openPage('reviews.html')">
            ⭐ Reviews
        </button>

    </div>

    <div class="status">

        <h3>📊 Restaurant Status</h3>

        <p>
            Restaurant:
            <strong id="statusRestaurant">Not Set</strong>
        </p>

        <p>
            Menu:
            <strong id="menuStatus">Not Updated</strong>
        </p>

        <p>
            Gallery:
            <strong id="galleryStatus">Available</strong>
        </p>

    </div>
    <div class="status">
    <h3>📊 Today's Summary</h3>

    <p>
        📦 Today's Orders:
        <strong id="todayOrders">0</strong>
    </p>

    <p>
        💰 Today's Sales:
        <strong id="todaySales">₹0</strong>
    </p>

    <p>
        ✅ Completed:
        <strong id="todayCompleted">0</strong>
    </p>

    <p>
        🆕 Pending:
        <strong id="todayPending">0</strong>
    </p>
</div>
    <div class="card">
<h2>🔔 New Orders</h2>

<div id="ordersList">
    <p>Orders loading...</p>
</div>
        <button onclick="openWebsite()">
            🌐 View My Website
        </button>

        <button class="logout" onclick="logout()">
            🚪 Logout
        </button>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

function openPage(page) {
    window.location.href = page;
}


function loadDashboard() {

    let restaurant =
        localStorage.getItem("restaurantName");

    let menu =
        localStorage.getItem("restaurantMenu");


    if (restaurant && restaurant.trim() !== "") {

        document.getElementById("restaurantName")
            .textContent = restaurant;

        document.getElementById("statusRestaurant")
            .textContent = restaurant;

    } else {

        document.getElementById("restaurantName")
            .textContent = "Restaurant Name";

    }


    if (menu && menu.trim() !== "") {

        document.getElementById("menuStatus")
            .textContent = "Updated ✅";

    } else {

        document.getElementById("menuStatus")
            .textContent = "Not Updated";

    }

}


function openWebsite() {

    window.location.href = "index.html";

}


function logout() {

    localStorage.removeItem("ownerLoggedIn");

    window.location.href = "login.html";

}


loadDashboard();
/* ==============================
   FIREBASE ORDERS - DASHBOARD
   ============================== */

const firebaseConfig = {
    apiKey: "AIzaSyA5GBPb4gmsiEIe0n6bLA-3r2qJTdcJm-A",
    authDomain: "popswolfs-connect.firebaseapp.com",
    projectId: "popswolfs-connect",
    storageBucket: "popswolfs-connect.firebasestorage.app",
    messagingSenderId: "76180350352",
    appId: "1:76180350352:web:731ea5982a1d885075969"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const orderDB = firebase.firestore();

function loadOrders() {

    const ordersList = document.getElementById("ordersList");

    orderDB.collection("orders")
        .where("shopId", "==", "SHOP001")
        .onSnapshot(function(snapshot) {

            let todayOrdersCount = 0;
            let todaySalesTotal = 0;
            let todayCompletedCount = 0;
            let todayPendingCount = 0;

            const now = new Date();

            const startOfToday = new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate()
            );

            const endOfToday = new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate() + 1
            );

            ordersList.innerHTML = "";

            snapshot.forEach(function(doc) {

                const order = doc.data();

                /* =========================
                   TODAY'S SUMMARY
                   ========================= */

                let orderDate = null;

                if (order.createdAt) {

                    if (order.createdAt.toDate) {
                        orderDate = order.createdAt.toDate();
                    } else {
                        orderDate = new Date(order.createdAt);
                    }

                }

                if (
                    orderDate &&
                    orderDate >= startOfToday &&
                    orderDate < endOfToday
                ) {

                    todayOrdersCount++;

                    todaySalesTotal += Number(order.total || 0);

                    if (order.status === "completed") {
                        todayCompletedCount++;
                    } else {
                        todayPendingCount++;
                    }

                }


                /* =========================
                   NEW ORDERS DISPLAY
                   ========================= */

                if (order.status === "completed") {
                    return;
                }

                const orderBox =
                    document.createElement("div");

                orderBox.style.border =
                    "1px solid #ddd";

                orderBox.style.padding =
                    "15px";

                orderBox.style.marginBottom =
                    "12px";

                orderBox.style.borderRadius =
                    "10px";


                orderBox.innerHTML = `
                    <h3>🔔 New Order</h3>

                    <p>
                        <strong>Table:</strong>
                        ${order.tableNumber || "-"}
                    </p>

                    <p>
                        <strong>Items:</strong>
                        ${
                            (order.items || [])
                            .map(function(item) {
                                return `${item.name} × ${item.quantity}`;
                            })
                            .join("<br>")
                        }
                    </p>

                    <p>
                        <strong>Total:</strong>
                        ₹${order.total || 0}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        ${order.status || "new"}
                    </p>

                    <button onclick="markOrderDone('${doc.id}')">
                        ✅ Order Done
                    </button>
                `;

                ordersList.appendChild(orderBox);

            });


            /* =========================
               UPDATE TODAY'S SUMMARY
               ========================= */

            document.getElementById("todayOrders")
                .textContent = todayOrdersCount;

            document.getElementById("todaySales")
                .textContent = "₹" + todaySalesTotal;

            document.getElementById("todayCompleted")
                .textContent = todayCompletedCount;

            document.getElementById("todayPending")
                .textContent = todayPendingCount;


            /* =========================
               NO NEW ORDERS
               ========================= */

            if (ordersList.innerHTML === "") {

                ordersList.innerHTML =
                    "<p>No new orders.</p>";

            }

        }, function(error) {

            console.error("Orders error:", error);

            ordersList.innerHTML =
                "<p>❌ Orders load nahi ho rahe.</p>";

        });
}

function markOrderDone(orderId) {

    orderDB.collection("orders")
        .doc(orderId)
        .update({
            status: "completed"
        })
        .then(function() {

            alert("✅ Order completed!");

        })
        .catch(function(error) {

            console.error(error);

            alert("❌ Order update nahi hua.");
        });
}


/* Start orders */

loadOrders(); 
</script>

</body>
</html>
