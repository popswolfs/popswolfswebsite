<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POPSWOLFS CONNECT - Owner Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

header{
    background:#111;
    color:white;
    padding:25px 20px;
    text-align:center;
}

header h1{
    font-size:26px;
}

header p{
    color:#aaa;
    margin-top:8px;
}

.shop-id{
    color:#aaa;
    font-size:13px;
    margin-top:10px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:16px;
    margin-bottom:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.card h2{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
    margin-bottom:6px;
}

input,textarea,select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

textarea{
    min-height:80px;
    resize:vertical;
}

button{
    border:none;
    border-radius:10px;
    padding:13px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.add-shop-btn{
    width:100%;
    background:#198754;
    color:white;
    margin-top:15px;
}

.save-btn{
    width:100%;
    background:#111;
    color:white;
    margin-top:20px;
}

.add-btn{
    background:#198754;
    color:white;
    margin-top:15px;
}

.delete-btn{
    background:#dc3545;
    color:white;
    margin-top:10px;
}

.menu-box{
    border:1px solid #ddd;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
}

.menu-box input{
    margin-bottom:8px;
}

.status{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.preview-btn{
    display:block;
    text-align:center;
    background:#eee;
    color:#111;
    text-decoration:none;
    padding:13px;
    border-radius:10px;
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>

<h1>🐺 POPSWOLFS CONNECT</h1>

<p>Owner Dashboard</p>

<div class="shop-id">
Shop ID:
<strong id="shop-id-display">---</strong>
</div>

</header>

<main class="container">

<!-- SHOP MANAGEMENT -->

<section class="card">

<h2>🏪 Shop Management</h2>

<label>Select Shop</label>

<select id="shop-id">
    <option value="">Loading shops...</option>
</select>

<button
class="add-shop-btn"
onclick="createNewShop()">

➕ Add New Shop

</button>

</section>


<!-- SHOP INFORMATION -->

<section class="card">

<h2>📝 Shop Information</h2>

<label>Restaurant Name</label>

<input
type="text"
id="shop-name"
placeholder="Restaurant Name">


<label>Tagline</label>

<input
type="text"
id="shop-tagline"
placeholder="Welcome to our restaurant">


<label>Logo</label>

<input
type="text"
id="shop-logo"
placeholder="popswolfs.jpeg">


<label>Address</label>

<textarea
id="shop-address"
placeholder="Restaurant address"></textarea>


<label>Opening Hours</label>

<textarea
id="shop-hours"
placeholder="Monday - Sunday&#10;10:00 AM - 11:00 PM"></textarea>

</section>


<!-- CONTACT -->

<section class="card">

<h2>📲 Contact & Links</h2>

<label>Phone Number</label>

<input
type="text"
id="shop-phone"
placeholder="+919876543210">


<label>WhatsApp Number</label>

<input
type="text"
id="shop-whatsapp"
placeholder="919876543210">


<label>Instagram Link</label>

<input
type="text"
id="shop-instagram"
placeholder="https://instagram.com">


<label>Google Maps Link</label>

<input
type="text"
id="shop-maps"
placeholder="https://maps.google.com">


<label>Google Review Link</label>

<input
type="text"
id="shop-review"
placeholder="https://www.google.com">

</section>


<!-- MENU -->

<section class="card">

<h2>🍽️ Menu</h2>

<div id="menu-container"></div>

<button
class="add-btn"
onclick="addMenuItem()">

➕ Add Menu Item

</button>

</section>


<!-- SPECIAL -->

<section class="card">

<h2>🔥 Today's Special</h2>

<label>Special Name</label>

<input
type="text"
id="special-name"
placeholder="Special Combo Meal">


<label>Description</label>

<input
type="text"
id="special-description"
placeholder="Burger + Fries + Drink">


<label>Price</label>

<input
type="text"
id="special-price"
placeholder="₹499">

</section>


<!-- OFFER -->

<section class="card">

<h2>🎉 Offer</h2>

<label>Customer Offer</label>

<textarea
id="shop-offer"
placeholder="Get 10% OFF on your next visit ❤️"></textarea>

</section>


<!-- SAVE -->

<section class="card">

<button
class="save-btn"
onclick="saveShop()">

💾 Save Shop Changes

</button>

<div
class="status"
id="status">
</div>

<a
id="preview-link"
class="preview-btn"
href="#"
target="_blank">

👀 Preview Customer Page

</a>

</section>

</main>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

apiKey:
"AIzaSyA5GBPb4gmsiEI0n06bLA-3r2qJTdcJm-A",

authDomain:
"popswolfs-connect.firebaseapp.com",

projectId:
"popswolfs-connect",

storageBucket:
"popswolfs-connect.firebasestorage.app",

messagingSenderId:
"761803503052",

appId:
"1:761803503052:web:731ea5982a21d885075969",

measurementId:
"G-R3H3C9TL7Q"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const auth = firebase.auth();


let shops = {};

let currentShopId = "";


/* =========================================
   CHECK LOGIN
========================================= */

auth.onAuthStateChanged(function(user){

    if(!user){

        window.location.href =
        "login.html";

        return;

    }

    loadAllShops();

});


/* =========================================
   LOAD OWNER'S SHOP ONLY
========================================= */

async function loadAllShops(){

    const user = auth.currentUser;

    if(!user){
        window.location.href = "login.html";
        return;
    }

    try{

        const snapshot = await db
        .collection("shops")
        .where("ownerEmail","==",user.email.toLowerCase())
        .get();

        shops = {};

        snapshot.forEach(function(doc){

            shops[doc.id] = doc.data();

        });

        populateShopSelector();

        const shopIds = Object.keys(shops);

        if(shopIds.length > 0){

            loadShop(shopIds[0]);

        }else{

            document.getElementById("shop-id").innerHTML =
            '<option value="">No shop assigned</option>';

            showStatus(
                "❌ Is email par koi shop assigned nahi hai."
            );

        }

    }

    catch(error){

        console.error(error);

        showStatus(
            "❌ Shop load error: " + error.message
        );

    }

}

/* =========================================
   SHOP DROPDOWN
========================================= */

function populateShopSelector(){

    const selector =
    document.getElementById("shop-id");

    selector.innerHTML = "";

    const ids =
    Object.keys(shops).sort();


    if(ids.length === 0){

        selector.innerHTML =
        '<option value="">No shops</option>';

        return;

    }


    ids.forEach(function(id){

        const option =
        document.createElement("option");

        option.value = id;

        option.textContent =
        id +
        " - " +
        (shops[id].name || "New Shop");

        selector.appendChild(option);

    });


    selector.value =
    currentShopId || ids[0];

}


document.getElementById("shop-id")
.addEventListener("change",function(){

    loadShop(this.value);

});


/* =========================================
   GENERATE UNLIMITED SHOP ID
========================================= */

function generateShopId(){

    let highest = 0;


    Object.keys(shops).forEach(function(id){

        const match =
        id.match(/^SHOP(\d+)$/);


        if(match){

            const number =
            parseInt(match[1]);

            if(number > highest){

                highest = number;

            }

        }

    });


    let next =
    highest + 1;


    return "SHOP" +
    String(next).padStart(3,"0");

}


/* =========================================
   CREATE NEW SHOP
========================================= */

async function createNewShop(){

    const shopId =
    generateShopId();


    const newShop = {

        name:"New Restaurant",

        tagline:"Welcome to our restaurant",

        logo:"popswolfs.jpeg",

        review:"https://www.google.com",

        phone:"",

        whatsapp:"",

        instagram:"",

        maps:"",

        address:"",

        hours:"Monday - Sunday\n10:00 AM - 11:00 PM",

        offer:"",

        special:{

            name:"",

            description:"",

            price:""

        },

        menu:[]

    };


    try{

        await db.collection("shops")
        .doc(shopId)
        .set(newShop);


        shops[shopId] =
        newShop;


        currentShopId =
        shopId;


        populateShopSelector();

        loadShop(shopId);


        showStatus(
        "✅ New Shop Created: " +
        shopId
        );

    }

    catch(error){

        console.error(error);

        showStatus(
        "❌ Shop create error: "
        + error.message
        );

    }

}


/* =========================================
   LOAD SHOP
========================================= */

function loadShop(shopId){

    const shop =
    shops[shopId];


    if(!shop){

        return;

    }


    currentShopId =
    shopId;


    document.getElementById(
    "shop-id-display"
    ).innerText =
    shopId;


    document.getElementById(
    "shop-id"
    ).value =
    shopId;


    document.getElementById(
    "shop-name"
    ).value =
    shop.name || "";


    document.getElementById(
    "shop-tagline"
    ).value =
    shop.tagline || "";


    document.getElementById(
    "shop-logo"
    ).value =
    shop.logo || "";


    document.getElementById(
    "shop-address"
    ).value =
    shop.address || "";


    document.getElementById(
    "shop-hours"
    ).value =
    shop.hours || "";


    document.getElementById(
    "shop-phone"
    ).value =
    shop.phone || "";


    document.getElementById(
    "shop-whatsapp"
    ).value =
    shop.whatsapp || "";


    document.getElementById(
    "shop-instagram"
    ).value =
    shop.instagram || "";


    document.getElementById(
    "shop-maps"
    ).value =
    shop.maps || "";


    document.getElementById(
    "shop-review"
    ).value =
    shop.review || "";


    document.getElementById(
    "special-name"
    ).value =
    shop.special?.name || "";


    document.getElementById(
    "special-description"
    ).value =
    shop.special?.description || "";


    document.getElementById(
    "special-price"
    ).value =
    shop.special?.price || "";


    document.getElementById(
    "shop-offer"
    ).value =
    shop.offer || "";


    renderMenu(
    shop.menu || []
    );


    document.getElementById(
    "preview-link"
    ).href =
    "index.html?shop=" +
    encodeURIComponent(shopId);

}


/* =========================================
   MENU
========================================= */

function renderMenu(menu){

    const container =
    document.getElementById(
    "menu-container"
    );


    container.innerHTML = "";


    menu.forEach(function(item){

        createMenuBox(item);

    });

}


function createMenuBox(item){

    const container =
    document.getElementById(
    "menu-container"
    );


    const box =
    document.createElement("div");


    box.className =
    "menu-box";


    box.innerHTML = `

<label>Category</label>

<input
type="text"
class="menu-category"
value="${escapeHtml(item.category || "")}"
placeholder="Burgers">


<label>Item Name</label>

<input
type="text"
class="menu-name"
value="${escapeHtml(item.name || "")}"
placeholder="Chicken Burger">


<label>Description</label>

<input
type="text"
class="menu-description"
value="${escapeHtml(item.description || "")}"
placeholder="Cheese Loaded">


<label>Price</label>

<input
type="text"
class="menu-price"
value="${escapeHtml(item.price || "")}"
placeholder="₹299">


<button
class="delete-btn"
onclick="this.parentElement.remove()">

🗑️ Delete Item

</button>

`;


    container.appendChild(box);

}


function escapeHtml(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


function addMenuItem(){

    createMenuBox({

        category:"New Category",

        name:"New Item",

        description:"Description",

        price:"₹0"

    });

}


/* =========================================
   SAVE SHOP
========================================= */

async function saveShop(){

    const shopId =
    document.getElementById(
    "shop-id"
    ).value;


    if(!shopId){

        showStatus(
        "❌ Pehle shop select karo."
        );

        return;

    }


    const menu = [];


    document
    .querySelectorAll(".menu-box")
    .forEach(function(box){

        menu.push({

            category:
            box.querySelector(
            ".menu-category"
            ).value,

            name:
            box.querySelector(
            ".menu-name"
            ).value,

            description:
            box.querySelector(
            ".menu-description"
            ).value,

            price:
            box.querySelector(
            ".menu-price"
            ).value

        });

    });


    const shopData = {

        name:
        document.getElementById(
        "shop-name"
        ).value,

        tagline:
        document.getElementById(
        "shop-tagline"
        ).value,

        logo:
        document.getElementById(
        "shop-logo"
        ).value,

        review:
        document.getElementById(
        "shop-review"
        ).value,

        phone:
        document.getElementById(
        "shop-phone"
        ).value,

        whatsapp:
        document.getElementById(
        "shop-whatsapp"
        ).value,

        instagram:
        document.getElementById(
        "shop-instagram"
        ).value,

        maps:
        document.getElementById(
        "shop-maps"
        ).value,

        address:
        document.getElementById(
        "shop-address"
        ).value,

        hours:
        document.getElementById(
        "shop-hours"
        ).value,

        offer:
        document.getElementById(
        "shop-offer"
        ).value,

        special:{

            name:
            document.getElementById(
            "special-name"
            ).value,

            description:
            document.getElementById(
            "special-description"
            ).value,

            price:
            document.getElementById(
            "special-price"
            ).value

        },

        menu:menu,

        updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()

    };


    try{

        await db.collection("shops")
        .doc(shopId)
        .set(shopData,{merge:true});


        shops[shopId] =
        {
            ...shops[shopId],
            ...shopData
        };


        populateShopSelector();

        document.getElementById(
        "shop-id"
        ).value =
        shopId;


        showStatus(
        "✅ " +
        shopId +
        " saved successfully!"
        );

    }

    catch(error){

        console.error(error);

        showStatus(
        "❌ Save failed: " +
        error.message
        );

    }

}


/* =========================================
   STATUS
========================================= */

function showStatus(message){

    const status =
    document.getElementById(
    "status"
    );


    status.innerText =
    message;


    setTimeout(function(){

        status.innerText = "";

    },4000);

}

</script>

</body>
</html>
